- title: Teach-Former
  subtitle: Multi-teacher knowledge distillation for medical image segmentation
  group: featured
  image: images/fallback.svg
  link: https://github.com/FarihaHossain/TeachFormer
  description: A knowledge distillation framework where a lightweight student model learns jointly from teacher models trained on CT, PET, and MRI, improving segmentation accuracy while cutting computational overhead. Published in Scientific Reports.
  repo: FarihaHossain/TeachFormer
  tags:
    - software

